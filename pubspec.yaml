name: prompteur_video
description: Application Prompteur Vidéo pour Android
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  provider: ^6.1.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  gal: ^1.1.0
  image: ^4.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dependency_overrides:
  package_info_plus: '>=8.0.0 <9.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/control.html
