<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Prompteur — Télécommande</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1A1A2E;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:16px;gap:12px;-webkit-tap-highlight-color:transparent}
  h1{font-size:18px;color:#6C63FF}
  #st{font-size:12px;color:#666}
  .preview-wrap{position:relative;width:200px;height:356px;
    background:#0a0a14;border-radius:12px;overflow:hidden;
    border:1px solid #2a2a4a;flex-shrink:0;box-shadow:0 6px 30px rgba(108,99,255,.12)}
  #stream-img{width:100%;height:100%;object-fit:cover;display:block}
  #rec-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);
    display:none;align-items:center;justify-content:center;
    color:#ff4444;font-weight:bold;font-size:14px;text-align:center;padding:10px;
    flex-direction:column;gap:6px}
  #rec-overlay .dot{width:14px;height:14px;border-radius:50%;background:#ff4444;
    animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .info{display:flex;justify-content:space-between;width:100%;max-width:480px;
    font-size:13px;color:#888}
  .info b{color:#fff}
  .pb{width:100%;max-width:480px;background:#16213E;border-radius:99px;height:6px}
  .pf{height:6px;background:linear-gradient(90deg,#6C63FF,#9D8DFF);border-radius:99px;width:0%;transition:width .4s}
  .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:480px}
  .b{background:#16213E;border:1.5px solid #2a2a4a;border-radius:12px;
    color:#fff;padding:14px 8px;font-size:13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:background .12s,transform .08s,border-color .12s;user-select:none}
  .b:hover{background:#6C63FF;border-color:#6C63FF}
  .b:active{transform:scale(.94)}
  .b .i{font-size:22px}
  .full{grid-column:1/-1}
  .rec{border-color:#ff4444}
  .rec:hover,.rec.on{background:#cc0000;border-color:#ff4444}
  .kbd{color:#444;font-size:11px;text-align:center;line-height:2.2;max-width:480px;margin-top:4px}
  kbd{background:#16213E;padding:2px 7px;border-radius:5px;
    color:#888;border:1px solid #333;font-size:11px;font-family:inherit}
  .script-section{width:100%;max-width:480px;margin-top:8px}
  .script-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .script-label{color:#6C63FF;font-size:11px;font-weight:bold;letter-spacing:1.5px}
  .script-sync{color:#444;font-size:11px}
  .script-sync.ok{color:#4CAF50}
  .script-sync.warn{color:#FFA726}
  textarea#script-area{width:100%;height:240px;background:#16213E;color:#fff;
    border:1.5px solid #2a2a4a;border-radius:12px;padding:12px;font-size:14px;
    resize:vertical;line-height:1.6;font-family:inherit;outline:none;
    transition:border-color .2s}
  textarea#script-area:focus{border-color:#6C63FF}
  .hint{color:#444;font-size:10px;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<h1>Prompteur — Télécommande</h1>
<div id="st">Connexion…</div>

<div class="preview-wrap">
  <img id="stream-img" src="/stream" alt="Aperçu caméra">
  <div id="rec-overlay">
    <div class="dot"></div>
    <div>Enregistrement<br>en cours…</div>
  </div>
</div>

<div class="info">
  <span>Progression : <b id="pct">0%</b></span>
  <span>Vitesse : <b id="spd">—</b></span>
  <span id="dur"></span>
</div>
<div class="pb"><div class="pf" id="prog"></div></div>

<div class="g">
  <button class="b" onclick="s('rewind2')"><span class="i">&#8249;&#8249;</span>-2 s</button>
  <button class="b" id="bp" onclick="s('toggle')"><span class="i" id="ip">&#9646;&#9646;</span><span id="lp">PAUSE</span></button>
  <button class="b" onclick="s('home')"><span class="i">&#9198;</span>DÉBUT</button>
  <button class="b" onclick="s('speed-')"><span class="i">&#128022;</span>LENT</button>
  <button class="b" onclick="s('speed+')"><span class="i">&#128007;</span>VITE</button>
  <button class="b" onclick="s('rewind2')"><span class="i">&#8617;</span>RETOUR</button>
  <button class="b rec full" id="br" onclick="s('rec')">
    <span class="i" id="ir">&#9210;</span>
    <span id="lr">DÉMARRER L'ENREGISTREMENT</span>
  </button>
</div>

<div class="kbd">
  <kbd>Espace</kbd> Pause/Play &nbsp;
  <kbd>&larr;</kbd> -2 s &nbsp;
  <kbd>&uarr;</kbd> + Vite &nbsp;
  <kbd>&darr;</kbd> - Lent &nbsp;
  <kbd>Home</kbd> Début &nbsp;
  <kbd>R</kbd> REC
</div>

<div class="script-section">
  <div class="script-header">
    <span class="script-label">SCRIPT</span>
    <span class="script-sync" id="sync-st">En attente…</span>
  </div>
  <textarea id="script-area" placeholder="Colle ton script ici (depuis Google Docs, l'assistant, etc.)&#10;&#10;Le texte est synchronisé automatiquement avec le téléphone dès que tu arrêtes de taper."></textarea>
  <div class="hint">Astuces : <kbd>**gras**</kbd> · <kbd># Section</kbd> · <kbd>// commentaire perso</kbd></div>
</div>

<script>
(function(){
  var ws = null;
  var reconnectDelay = 800;
  var reconnectTimer = null;
  var heartbeatTimer = null;
  var lastSentScript = null;
  var scriptDebounce = null;

  function $(id){ return document.getElementById(id); }
  var stEl = $('st');
  var syncEl = $('sync-st');
  var ta = $('script-area');

  function setStatus(connected){
    if(connected){
      stEl.innerHTML = '<span style="color:#4CAF50">&#9679;</span> Connecté';
    } else {
      stEl.innerHTML = '<span style="color:#f44">&#9679;</span> Déconnecté — reconnexion…';
    }
  }

  function setSyncOk(){ syncEl.textContent = 'Synchronisé ✓'; syncEl.className = 'script-sync ok'; }
  function setSyncWarn(msg){ syncEl.textContent = msg; syncEl.className = 'script-sync warn'; }

  function connect(){
    if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    try {
      ws = new WebSocket('ws://' + location.host + '/ws');
    } catch (e) {
      scheduleReconnect();
      return;
    }
    ws.onopen = function(){
      setStatus(true);
      reconnectDelay = 800;
      // heartbeat léger pour ne pas s'endormir
      if(heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(function(){
        if(ws && ws.readyState === 1) ws.send('ping');
      }, 12000);
    };
    ws.onclose = function(){
      setStatus(false);
      if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
      scheduleReconnect();
    };
    ws.onerror = function(){
      try { ws.close(); } catch(_) {}
    };
    ws.onmessage = onMessage;
  }

  function scheduleReconnect(){
    if(reconnectTimer) return;
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      reconnectDelay = Math.min(reconnectDelay * 1.5, 6000);
      connect();
    }, reconnectDelay);
  }

  function onMessage(e){
    var data = e.data;
    if(typeof data !== 'string') return;
    if(data === 'pong') return;

    if(data.indexOf('script:') === 0){
      var txt = data.substring(7);
      if(ta.value !== txt){
        // Ne pas écraser si l'utilisateur est en train de taper
        if(document.activeElement !== ta){
          ta.value = txt;
        }
        lastSentScript = txt;
      }
      setSyncOk();
      return;
    }

    var d;
    try { d = JSON.parse(data); } catch(_) { return; }
    if(!d) return;

    $('ip').innerHTML = d.playing ? '&#9646;&#9646;' : '&#9654;';
    $('lp').textContent = d.playing ? 'PAUSE' : 'REPRENDRE';
    $('spd').textContent = d.speed;
    $('pct').textContent = d.progress + '%';
    $('prog').style.width = d.progress + '%';
    $('ir').innerHTML = d.recording ? '&#9209;' : '&#9210;';
    $('lr').textContent = d.recording ? ('STOP — ' + d.duration) : 'DÉMARRER L\'ENREGISTREMENT';

    var ro = $('rec-overlay');
    var si = $('stream-img');
    if(d.recording){
      ro.style.display = 'flex';
      $('br').classList.add('on');
    } else {
      // Forcer le rechargement du stream après un REC pour éviter une frame figée
      if(ro.style.display === 'flex'){
        si.src = '/stream?t=' + Date.now();
      }
      ro.style.display = 'none';
      $('br').classList.remove('on');
    }
  }

  function s(cmd){
    if(ws && ws.readyState === 1) ws.send(cmd);
  }
  window.s = s; // expose pour les boutons inline

  // Sync script PC → téléphone (debounce)
  ta.addEventListener('input', function(){
    setSyncWarn('Saisie…');
    clearTimeout(scriptDebounce);
    scriptDebounce = setTimeout(function(){
      if(ws && ws.readyState === 1){
        if(ta.value === lastSentScript){ setSyncOk(); return; }
        ws.send('script:' + ta.value);
        lastSentScript = ta.value;
        setSyncOk();
      } else {
        setSyncWarn('Hors ligne — sera envoyé à la reconnexion');
      }
    }, 500);
  });

  // Raccourcis clavier — désactivés quand on tape dans la zone script
  document.addEventListener('keydown', function(e){
    if(document.activeElement === ta) return;
    switch(e.code){
      case 'Space':     e.preventDefault(); s('toggle'); break;
      case 'ArrowLeft': e.preventDefault(); s('rewind2'); break;
      case 'ArrowUp':   e.preventDefault(); s('speed+'); break;
      case 'ArrowDown': e.preventDefault(); s('speed-'); break;
      case 'Home':      e.preventDefault(); s('home'); break;
      case 'KeyR':      s('rec'); break;
    }
  });

  connect();
})();
</script>
</body>
</html>
