name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create base Flutter project
        run: |
          flutter create \
            --org com.hichamozor \
            --project-name prompteur_video \
            --platforms android \
            /tmp/app

      - name: Apply custom source files
        run: |
          rm -rf /tmp/app/lib/
          cp -r lib/ /tmp/app/lib/
          mkdir -p /tmp/app/assets
          cp -r assets/. /tmp/app/assets/
          cp pubspec.yaml /tmp/app/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml \
             /tmp/app/android/app/src/main/AndroidManifest.xml
          # Kotlin DSL (Flutter recent)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
             /tmp/app/android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
             /tmp/app/android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' \
             /tmp/app/android/app/build.gradle.kts 2>/dev/null || true
          # Groovy DSL (anciennes versions)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
             /tmp/app/android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
             /tmp/app/android/app/build.gradle 2>/dev/null || true

      - name: Flutter pub get
        working-directory: /tmp/app
        run: flutter pub get

      - name: Build release APK
        working-directory: /tmp/app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompteur-video-v2.0
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
